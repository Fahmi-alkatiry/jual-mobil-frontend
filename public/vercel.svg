<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Brand Gradient: Vibrant Orange to Deep Amber -->
    <linearGradient id="pamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Top Soft Gloss Sheen -->
    <linearGradient id="pamGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="pamDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ea580c" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#pamGradient)" filter="url(#pamDropShadow)" />

  <!-- Inner Top Sheen -->
  <rect x="36" y="36" width="440" height="210" rx="116" fill="url(#pamGloss)" />

  <!-- Crisp Inner Border Accent -->
  <rect x="34" y="34" width="444" height="444" rx="118" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" />

  <!-- Putra Aditya Motor Signature Car Emblem -->
  <g transform="translate(94, 94) scale(13.5)" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
    <circle cx="7" cy="17" r="2" fill="#ffffff" stroke="#ffffff" stroke-width="1" />
    <path d="M9 17h6" />
    <circle cx="17" cy="17" r="2" fill="#ffffff" stroke="#ffffff" stroke-width="1" />
  </g>
</svg>
